services:
  voxsum:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: voxsum

    restart: unless-stopped

    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN in .env or environment}
      API_BASE: ${API_BASE:?Set API_BASE in .env or environment}
      API_KEY: ${API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in .env or environment}
      ASR_MODEL: ${ASR_MODEL:-gigaam-v3-e2e-rnnt}
      PROXY: ${PROXY:-}
      TG_PROXY: ${TG_PROXY:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      - "${HF_CACHE_DIR:-./data/huggingface}:/app/data/huggingface"
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "1"
